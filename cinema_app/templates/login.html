{% extends "base.html" %}
{% block title %}CinemaHub — Đăng nhập{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" id="email" class="form-control"
                                   placeholder="email@example.com" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="matKhau" class="form-label fw-bold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="matKhau" id="matKhau" class="form-control"
                                   placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">
                        <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                    </button>
                </form>

                <hr>

                <div class="text-center">
                    <p class="mb-2">Chưa có tài khoản?
                        <a href="{{ url_for('register') }}" class="fw-bold">Đăng ký ngay</a>
                    </p>
                </div>

                <!-- Demo accounts -->
                <div class="alert alert-info small mt-3 mb-0">
                    <i class="bi bi-info-circle-fill"></i> <strong>Tài khoản demo:</strong><br>
                    Mật khẩu mặc định tài khoản sẵn: <code>123456</code><br>
                    <small class="text-muted">Hoặc đăng ký tài khoản mới (nhận 5.000.000 VND ví ảo)</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
