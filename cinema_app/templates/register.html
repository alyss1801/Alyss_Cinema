{% extends "base.html" %}
{% block title %}CinemaHub — Đăng ký{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Đăng ký tài khoản</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-success small mb-4">
                    <i class="bi bi-gift-fill"></i> <strong>Ưu đãi:</strong> Tài khoản mới nhận ngay <strong>5.000.000 VND</strong> trong ví ảo để trải nghiệm đặt vé!
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="hoTen" class="form-label fw-bold">Họ tên <span class="text-danger">*</span></label>
                            <input type="text" name="hoTen" id="hoTen" class="form-control"
                                   placeholder="Nguyễn Văn A" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" id="email" class="form-control"
                                   placeholder="email@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="soDienThoai" class="form-label fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" name="soDienThoai" id="soDienThoai" class="form-control"
                                   placeholder="0901234567" required>
                        </div>
                        <div class="col-md-6">
                            <label for="ngaySinh" class="form-label fw-bold">Ngày sinh <span class="text-danger">*</span></label>
                            <input type="date" name="ngaySinh" id="ngaySinh" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="gioiTinh" class="form-label fw-bold">Giới tính</label>
                            <select name="gioiTinh" id="gioiTinh" class="form-select">
                                <option value="Nam">Nam</option>
                                <option value="Nu">Nữ</option>
                                <option value="Khac" selected>Khác</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="diaChi" class="form-label fw-bold">Địa chỉ</label>
                            <input type="text" name="diaChi" id="diaChi" class="form-control"
                                   placeholder="TP. HCM">
                        </div>
                        <div class="col-md-6">
                            <label for="matKhau" class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" name="matKhau" id="matKhau" class="form-control"
                                   placeholder="Ít nhất 4 ký tự" minlength="4" required>
                        </div>
                        <div class="col-md-6">
                            <label for="matKhau2" class="form-label fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" name="matKhau2" id="matKhau2" class="form-control"
                                   placeholder="Nhập lại mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg mt-4">
                        <i class="bi bi-person-plus"></i> Đăng ký
                    </button>
                </form>

                <hr>
                <div class="text-center">
                    <p class="mb-0">Đã có tài khoản?
                        <a href="{{ url_for('login') }}" class="fw-bold">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
